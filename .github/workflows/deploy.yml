name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  AWS_REGION: ap-southeast-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  build-and-deploy:
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static site to S3
        run: aws s3 sync client/dist s3://kwh-split-dev-site-646385694637/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2K9SXH3VS1V4X --paths "/*"

      - name: Deploy server to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/split-key.pem
          chmod 600 ~/.ssh/split-key.pem
          ssh-keyscan -H 18.138.220.212 >> ~/.ssh/known_hosts

          rsync -avz --delete -e "ssh -i ~/.ssh/split-key.pem" \
            server/dist/ \
            ec2-user@18.138.220.212:/home/ec2-user/app/server/dist/

          rsync -avz -e "ssh -i ~/.ssh/split-key.pem" \
            server/package.json \
            ec2-user@18.138.220.212:/home/ec2-user/app/server/package.json

          ssh -i ~/.ssh/split-key.pem ec2-user@18.138.220.212 << 'EOF'
            set -e
            cd /home/ec2-user/app/server
            pnpm install --prod
            node dist/db/migrate.js
            sudo systemctl daemon-reload
            sudo systemctl restart split-api
            sudo systemctl restart split-worker
          EOF
